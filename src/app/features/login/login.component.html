<div
  class="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans text-slate-100"
>
  <div
    class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl rounded-3xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden"
  >
    <div class="mb-6 text-center">
      <span class="text-2xl font-black tracking-tight text-white">
        NearBy<span class="text-emerald-400">.</span>
      </span>
      <h2 class="text-xl font-bold tracking-tight mt-2">Welcome back</h2>
      <p class="text-xs text-slate-400 mt-1">Log in to your account to continue.</p>
    </div>

    <form class="space-y-4" (submit)="$event.preventDefault()">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Email or Username</label>
        <input
          type="text"
          placeholder="alex@example.com"
          class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-slate-200"
        />
        <p class="text-[11px] font-medium text-rose-400 mt-1">Email or username is required.</p>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-medium text-slate-300">Password</label>
          <a href="#" class="text-[11px] text-emerald-400 hover:underline">Forgot?</a>
        </div>
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-slate-200"
        />
        <p class="text-[11px] font-medium text-rose-400 mt-1">Password is required.</p>
      </div>

      <button
        type="submit"
        class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/15 hover:shadow-emerald-500/25 transition-all"
      >
        Log In
      </button>

      <p class="text-xs text-center text-slate-400 mt-4">
        Don't have an account? <a href="#" class="text-emerald-400 hover:underline">Register</a>
      </p>
    </form>
  </div>
</div>
