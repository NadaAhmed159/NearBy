<div
  class="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans text-slate-100"
>
  <div
    class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl rounded-3xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden"
  >
    <div class="absolute -top-16 -right-16 w-40 h-40 bg-emerald-500/10 rounded-full blur-2xl"></div>

    <div class="mb-6 text-center">
      <div
        class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto mb-4 text-slate-950"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          ></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight">Change Password</h2>
      <p class="text-xs text-slate-400 mt-1">Update your password to keep your account secure.</p>
    </div>

    <form class="space-y-4" (submit)="$event.preventDefault()">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Current Password</label>
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-slate-200"
        />
        <p class="text-[11px] font-medium text-rose-400 mt-1">Current password is required.</p>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">New Password</label>
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-slate-200"
        />
        <p class="text-[11px] font-medium text-rose-400 mt-1">New password is required.</p>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Confirm New Password</label>
        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-slate-200"
        />
        <p class="text-[11px] font-medium text-rose-400 mt-1">Passwords do not match.</p>
      </div>

      <button
        type="submit"
        class="w-full mt-2 py-3 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/15 hover:shadow-emerald-500/25 transition-all"
      >
        Update Password
      </button>
    </form>
  </div>
</div>
