<nav
  class="bg-slate-950 border-b border-slate-800/80 px-4 sm:px-6 py-2.5 relative z-50 sticky top-0"
>
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <!-- Left: Brand Logo & Title -->
    <a routerLink="/feed" class="flex items-center gap-3 cursor-pointer">
      <div
        class="w-9 h-9 bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 rounded-xl flex items-center justify-center shadow-md shadow-emerald-500/10 shrink-0"
      >
        <svg
          class="w-5 h-5 text-emerald-400"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
          ></path>
        </svg>
      </div>
      <span class="text-lg font-bold text-slate-100 tracking-tight">NearBy Posts</span>
    </a>

    <!-- Center: Desktop Navigation Pills (Hidden on Mobile) -->
    <div
      class="hidden md:flex p-1 bg-slate-900/90 border border-slate-800 rounded-2xl items-center gap-1"
    >
      <a
        routerLink="/feed"
        routerLinkActive="bg-emerald-500 text-white shadow-md shadow-emerald-500/20 font-semibold"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          ></path>
        </svg>
        <span>Feed</span>
      </a>

      <a
        routerLink="/profile"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-emerald-500 text-white shadow-md shadow-emerald-500/20 font-semibold"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          ></path>
        </svg>
        <span>Profile</span>
      </a>

      <a
        routerLink="/notifications"
        routerLinkActive="bg-emerald-500 text-white shadow-md shadow-emerald-500/20 font-semibold"
        class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all cursor-pointer relative"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          ></path>
        </svg>
        <span>Notifications</span>
        @if (unreadCount > 0) {
          <span
            class="px-1.5 py-0.5 text-[10px] font-bold bg-rose-500 text-white rounded-full leading-none"
          >
            {{ unreadCount }}
          </span>
        }
      </a>
    </div>

    <!-- Right: Profile Trigger & Single Unified Dropdown -->
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex items-center gap-3 p-1 rounded-xl hover:bg-slate-900 transition-colors cursor-pointer outline-none"
      >
        <!-- Avatar with Online Badge -->
        <div class="relative">
          <img
            [src]="userData?.photo"
            [alt]="userData?.name"
            class="w-9 h-9 rounded-full border border-slate-700 bg-slate-900 object-cover"
          />
          <span
            class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-400 border-2 border-slate-950 rounded-full"
          ></span>
        </div>

        <!-- User Info -->
        <div class="text-left hidden sm:block">
          <div class="text-xs font-bold text-slate-200 leading-tight">{{ userData?.name }}</div>
          <div class="text-[11px] text-slate-500 font-medium">@{{ userData?.username }}</div>
        </div>

        <!-- Chevron Icon -->
        <svg
          class="w-4 h-4 text-slate-500"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Unified Dropdown Menu -->
      @if (isMenuOpen) {
        <div
          class="absolute right-0 mt-3 w-60 bg-slate-950 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden py-1"
        >
          <!-- User Details Header -->
          <div class="px-4 py-3 border-b border-slate-800/80">
            <p class="text-xs font-bold text-slate-200">{{ userData?.name }}</p>
            <p class="text-[11px] text-slate-500 truncate mt-0.5">
              {{ userData?.email || '@' + userData?.username }}
            </p>
          </div>

          <!-- Mobile Only Links (Visible on small screens) -->
          <div class="p-1.5 space-y-1 border-b border-slate-800/80 md:hidden">
            <a
              routerLink="/feed"
              (click)="closeMenu()"
              routerLinkActive="bg-emerald-500 text-white font-semibold"
              class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-900 transition-colors"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                ></path>
              </svg>
              <span>Feed</span>
            </a>

            <a
              routerLink="/profile"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
              routerLinkActive="bg-emerald-500 text-white font-semibold"
              class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-900 transition-colors"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                ></path>
              </svg>
              <span>Profile</span>
            </a>

            <a
              routerLink="/notifications"
              (click)="closeMenu()"
              routerLinkActive="bg-emerald-500 text-white font-semibold"
              class="flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-900 transition-colors"
            >
              <div class="flex items-center gap-3">
                <svg
                  class="w-4 h-4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                  ></path>
                </svg>
                <span>Notifications</span>
              </div>
              @if (unreadCount > 0) {
                <span class="px-1.5 py-0.5 text-[10px] font-bold bg-rose-500 text-white rounded-full">
                  {{ unreadCount }}
                </span>
              }
            </a>
          </div>

          <!-- Account Options (Always Visible) -->
          <div class="p-1.5 space-y-1">
            <a
              routerLink="/change-password"
              (click)="closeMenu()"
              class="flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-900 hover:text-white transition-colors cursor-pointer"
            >
              <svg
                class="w-4 h-4 text-slate-400"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
                ></path>
              </svg>
              <span>Change Password</span>
            </a>

            <button
              type="button"
              (click)="signOut()"
              class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-medium text-rose-400 hover:bg-rose-500/10 transition-colors cursor-pointer"
            >
              <svg
                class="w-4 h-4 text-rose-400"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                ></path>
              </svg>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
      }
    </div>
  </div>
</nav>
