<div class="mt-4 pt-4 border-t border-slate-800/80 bg-slate-950/40 -mx-5 -mb-5 p-5 rounded-b-2xl">
  <!-- Comments Count Header -->
  <div class="flex items-center gap-2 mb-4">
    <h4 class="text-xs font-bold text-slate-200">Comments</h4>
    <span
      class="px-2 py-0.5 bg-emerald-500/10 text-emerald-400 text-[10px] font-semibold rounded-full border border-emerald-500/20"
    >
      {{ comments.length }}
    </span>
  </div>

  <!-- Comments List -->
  <div class="space-y-3 mb-4">
    @for (comment of comments; track comment._id) {
      <div class="flex items-start gap-2.5">
        <img
          [src]="comment.commentCreator.photo"
          [alt]="comment.commentCreator.name"
          class="w-8 h-8 rounded-full border border-slate-700 bg-slate-950 object-cover mt-0.5"
        />
        <div class="flex-1">
          <!-- Comment Bubble -->
          <div
            class="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-3 inline-block max-w-full"
          >
            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-xs font-bold text-slate-100 leading-none">{{
                comment.commentCreator.name
              }}</span>
              <span class="text-[10px] text-slate-500">@{{ comment.commentCreator.username }}</span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed break-words">
              {{ comment.content }}
            </p>
          </div>

          <!-- Comment Actions Footer -->
          <div class="flex items-center gap-3 text-[10px] text-slate-500 mt-1 ml-2">
            <span>{{ comment.createdAt }}</span>
            <button type="button" class="hover:text-emerald-400 transition-colors font-medium">
              Like {{ comment.likes.length ? '(' + comment.likes.length + ')' : '(0)' }}
            </button>
            <button type="button" class="hover:text-emerald-400 transition-colors font-medium">
              Reply
            </button>
          </div>
        </div>
      </div>
    }
  </div>
  <!-- Add Comment Section -->
  <div class="flex items-start gap-2.5">
    <img
      [src]="userData.photo"
      alt="{{ userData.name }}"
      class="w-10 h-10 rounded-full object-cover border border-slate-700 bg-slate-950"
    />

    <form
      (submit)="submitComment($event)"
      class="flex-1 bg-slate-950/80 border border-slate-800 rounded-2xl p-2.5 focus-within:border-slate-700 transition-all"
    >
      <textarea
        [formControl]="commentControl"
        rows="2"
        placeholder="Comment as..."
        class="w-full bg-transparent text-xs text-slate-200 placeholder-slate-500 outline-none resize-none px-1"
      ></textarea>

      <!-- Selected Image Preview -->
      @if (selectedFilePreview) {
        <div class="relative my-2 max-w-xs">
          <img
            [src]="selectedFilePreview"
            class="w-20 h-20 object-cover rounded-lg border border-slate-800"
            alt="Preview"
          />
          <button
            (click)="removeFile()"
            type="button"
            class="absolute -top-1 -right-1 bg-slate-950 border border-slate-700 hover:bg-slate-800 text-slate-300 w-5 h-5 rounded-full flex items-center justify-center text-[10px]"
          >
            ✕
          </button>
        </div>
      }

      <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 mt-1">
        <!-- Hidden File Input -->
        <input
          type="file"
          #commentFileInput
          accept="image/*,video/*"
          class="hidden"
          (change)="onFileSelected($event)"
        />

        <!-- Attachment Button -->
        <button
          (click)="commentFileInput.click()"
          type="button"
          class="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-slate-300 text-[11px] font-medium rounded-full transition-colors"
        >
          <svg
            class="w-3.5 h-3.5 text-emerald-400"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 002 2v12a2 2 0 002 2z"
            ></path>
          </svg>
          <span>Photo/video</span>
        </button>

        <!-- Submit Button -->
        <button
          type="submit"
          class="w-7 h-7 bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded-full flex items-center justify-center transition-colors shadow-sm"
        >
          <svg
            class="w-3.5 h-3.5 rotate-45"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            ></path>
          </svg>
        </button>
      </div>
    </form>
  </div>
</div>
