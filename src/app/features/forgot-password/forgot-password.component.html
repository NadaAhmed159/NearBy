<div
  class="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans text-slate-100"
>
  <div
    class="w-full max-w-md bg-slate-900/90 backdrop-blur-xl rounded-3xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden"
  >
    <div class="absolute -bottom-16 -left-16 w-40 h-40 bg-teal-500/10 rounded-full blur-2xl"></div>

    <div class="mb-6 text-center">
      <div
        class="h-12 w-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 mx-auto mb-4 text-slate-950"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
          ></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold tracking-tight">Forgot Password?</h2>
      <p class="text-xs text-slate-400 mt-1">Enter your email and we'll send you a reset link.</p>
    </div>

    <form class="space-y-4" (submit)="$event.preventDefault()">
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">Email address</label>
        <input
          type="email"
          placeholder="name@example.com"
          class="w-full px-4 py-2.5 text-xs bg-slate-950 border border-slate-800 rounded-xl focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-slate-200"
        />
        <p class="text-[11px] font-medium text-rose-400 mt-1">Email is required.</p>
      </div>

      <button
        type="submit"
        class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-emerald-500/15 hover:shadow-emerald-500/25 transition-all"
      >
        Send Reset Link
      </button>

      <div class="text-center mt-4">
        <a href="#" class="text-xs text-emerald-400 hover:underline">Back to Login</a>
      </div>
    </form>
  </div>
</div>
